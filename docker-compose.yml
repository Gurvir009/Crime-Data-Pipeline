services:
  postgres:
    image: postgres:16
    container_name: crime_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: "crime data"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - metanet1

  postgres_mb:
    image: postgres:16
    container_name: postgres_metabase
    hostname: postgres_metabase
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${METABASE_DB_USER}
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD}
      POSTGRES_DB: metabaseappdb
    ports:
      - "5434:5432"
    volumes:
      - metabase_data:/var/lib/postgresql/data
    networks:
      - metanet1

  metabase:
    image: metabase/metabase:latest
    container_name: crime_metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_DB_USER}
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_HOST: postgres_metabase
    depends_on:
      - postgres_mb
    networks:
      - metanet1

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crime_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - metanet1

volumes:
  postgres_data:
  metabase_data:
  pgadmin_data:

networks:
  metanet1:
    driver: bridge